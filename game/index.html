<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Asteroids</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; display: block; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script>
(function () {
    "use strict";

    // ── Constants ──
    const ARENA_SIZE = 200;
    const HALF_ARENA = ARENA_SIZE / 2;
    const SHIP_THRUST = 0.15;
    const SHIP_BRAKE = 0.05;
    const SHIP_MAX_SPEED = 1.8;
    const SHIP_ROTATE_SPEED = 0.04;
    const BULLET_SPEED = 3.0;
    const BULLET_LIFETIME = 120; // frames (~2s at 60fps)
    const INITIAL_ASTEROIDS = 8;
    const ASTEROID_MIN_SPEED = 0.15;
    const ASTEROID_MAX_SPEED = 0.5;
    const ASTEROID_SIZES = { large: 8, medium: 4, small: 2 };
    const ASTEROID_POINTS = { large: 20, medium: 50, small: 100 };
    const STARTING_LIVES = 3;
    const SHIP_INVULN_TIME = 180; // frames
    const FIRE_COOLDOWN = 10; // frames

    // ── Game State ──
    var state = {
        score: 0,
        lives: STARTING_LIVES,
        wave: 1,
        gameOver: false,
        paused: false,
        shipInvuln: 0,
        fireCooldown: 0,
        asteroids: [],
        bullets: [],
        shipVelocity: new BABYLON.Vector3(0, 0, 0),
        keys: {}
    };

    // ── Engine Setup ──
    var canvas = document.getElementById("renderCanvas");
    var engine = new BABYLON.Engine(canvas, true, { stencil: true });
    var scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.03, 1);
    scene.ambientColor = new BABYLON.Color3(0.1, 0.1, 0.15);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.0008;
    scene.fogColor = new BABYLON.Color3(0.01, 0.01, 0.03);

    // ── Lighting ──
    var hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.3;
    hemiLight.diffuse = new BABYLON.Color3(0.4, 0.4, 0.6);

    var pointLight = new BABYLON.PointLight("shipLight", BABYLON.Vector3.Zero(), scene);
    pointLight.intensity = 1.5;
    pointLight.diffuse = new BABYLON.Color3(0.3, 0.6, 1.0);
    pointLight.range = 60;

    // ── Camera ──
    var camera = new BABYLON.FollowCamera("camera", new BABYLON.Vector3(0, 30, -30), scene);
    camera.radius = 30;
    camera.heightOffset = 12;
    camera.rotationOffset = 180;
    camera.cameraAcceleration = 0.05;
    camera.maxCameraSpeed = 15;
    camera.fov = 0.9;

    // ── Materials ──
    function createShipMaterial() {
        var mat = new BABYLON.StandardMaterial("shipMat", scene);
        mat.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.8);
        mat.emissiveColor = new BABYLON.Color3(0.05, 0.15, 0.6);
        mat.specularColor = new BABYLON.Color3(0.5, 0.5, 1.0);
        mat.specularPower = 64;
        return mat;
    }

    function createShipGlowMaterial() {
        var mat = new BABYLON.StandardMaterial("shipGlowMat", scene);
        mat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 1.0);
        mat.emissiveColor = new BABYLON.Color3(0.1, 0.4, 1.0);
        return mat;
    }

    function createAsteroidMaterial() {
        var mat = new BABYLON.StandardMaterial("asteroidMat", scene);
        var r = 0.4 + Math.random() * 0.3;
        var g = 0.2 + Math.random() * 0.2;
        var b = 0.1 + Math.random() * 0.1;
        mat.diffuseColor = new BABYLON.Color3(r, g, b);
        mat.emissiveColor = new BABYLON.Color3(r * 0.3, g * 0.2, b * 0.1);
        mat.specularColor = new BABYLON.Color3(0.2, 0.15, 0.1);
        mat.specularPower = 16;
        return mat;
    }

    function createBulletMaterial() {
        var mat = new BABYLON.StandardMaterial("bulletMat", scene);
        mat.diffuseColor = new BABYLON.Color3(1, 0.8, 0.2);
        mat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.1);
        return mat;
    }

    // ── Starfield ──
    function createStarfield() {
        var SPS = new BABYLON.SolidParticleSystem("stars", scene, { isPickable: false });
        var starModel = BABYLON.MeshBuilder.CreateSphere("starModel", { diameter: 1, segments: 4 }, scene);
        SPS.addShape(starModel, 1200);
        starModel.dispose();
        var mesh = SPS.buildMesh();
        mesh.hasVertexAlpha = false;

        var starMat = new BABYLON.StandardMaterial("starMat", scene);
        starMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
        starMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
        starMat.disableLighting = true;
        mesh.material = starMat;

        SPS.initParticles = function () {
            for (var i = 0; i < SPS.nbParticles; i++) {
                var p = SPS.particles[i];
                var spread = ARENA_SIZE * 2.5;
                p.position.x = (Math.random() - 0.5) * spread;
                p.position.y = (Math.random() - 0.5) * spread;
                p.position.z = (Math.random() - 0.5) * spread;
                var s = 0.1 + Math.random() * 0.5;
                p.scaling.setAll(s);
            }
        };

        SPS.initParticles();
        SPS.setParticles();
        SPS.isAlwaysVisible = true;
        mesh.freezeWorldMatrix();
        mesh.doNotSyncBoundingInfo = true;
    }
    createStarfield();

    // ── Ship ──
    function createShip() {
        var ship = new BABYLON.TransformNode("shipRoot", scene);

        // Main body: cone
        var body = BABYLON.MeshBuilder.CreateCylinder("shipBody", {
            diameterTop: 0,
            diameterBottom: 3,
            height: 6,
            tessellation: 8
        }, scene);
        body.rotation.x = Math.PI / 2;
        body.material = createShipMaterial();
        body.parent = ship;

        // Wings
        var leftWing = BABYLON.MeshBuilder.CreateBox("leftWing", { width: 4, height: 0.3, depth: 2.5 }, scene);
        leftWing.position.set(-2.2, 0, -0.5);
        leftWing.material = createShipMaterial();
        leftWing.parent = ship;

        var rightWing = BABYLON.MeshBuilder.CreateBox("rightWing", { width: 4, height: 0.3, depth: 2.5 }, scene);
        rightWing.position.set(2.2, 0, -0.5);
        rightWing.material = createShipMaterial();
        rightWing.parent = ship;

        // Engine glow
        var engineGlow = BABYLON.MeshBuilder.CreateSphere("engineGlow", { diameter: 1.8, segments: 8 }, scene);
        engineGlow.position.set(0, 0, -3);
        engineGlow.material = createShipGlowMaterial();
        engineGlow.parent = ship;

        // Cockpit
        var cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", { diameter: 1.6, segments: 8 }, scene);
        cockpit.position.set(0, 0.6, 1);
        var cockpitMat = new BABYLON.StandardMaterial("cockpitMat", scene);
        cockpitMat.diffuseColor = new BABYLON.Color3(0.1, 0.6, 0.9);
        cockpitMat.emissiveColor = new BABYLON.Color3(0.05, 0.3, 0.5);
        cockpitMat.alpha = 0.8;
        cockpit.material = cockpitMat;
        cockpit.parent = ship;

        ship.colliderRadius = 3;
        return ship;
    }

    var ship = createShip();
    camera.lockedTarget = ship;

    // Engine exhaust particle system
    var exhaustSystem = new BABYLON.ParticleSystem("exhaust", 200, scene);
    exhaustSystem.particleTexture = null;
    exhaustSystem.createPointEmitter(new BABYLON.Vector3(0, 0, -1), new BABYLON.Vector3(0, 0, -1));
    exhaustSystem.emitter = ship;
    exhaustSystem.minEmitBox = new BABYLON.Vector3(-0.5, -0.3, -3.5);
    exhaustSystem.maxEmitBox = new BABYLON.Vector3(0.5, 0.3, -3.5);
    exhaustSystem.color1 = new BABYLON.Color4(0.2, 0.5, 1.0, 1.0);
    exhaustSystem.color2 = new BABYLON.Color4(0.1, 0.3, 0.8, 0.8);
    exhaustSystem.colorDead = new BABYLON.Color4(0.0, 0.1, 0.3, 0.0);
    exhaustSystem.minSize = 0.3;
    exhaustSystem.maxSize = 0.8;
    exhaustSystem.minLifeTime = 0.1;
    exhaustSystem.maxLifeTime = 0.3;
    exhaustSystem.emitRate = 0;
    exhaustSystem.minEmitPower = 2;
    exhaustSystem.maxEmitPower = 5;
    exhaustSystem.updateSpeed = 0.02;
    exhaustSystem.start();

    // ── Asteroids ──
    function createAsteroid(position, sizeKey, velocity) {
        var radius = ASTEROID_SIZES[sizeKey];
        var mesh = BABYLON.MeshBuilder.CreateIcoSphere("asteroid", {
            radius: radius,
            subdivisions: 2,
            flat: true
        }, scene);

        // Deform vertices for irregular shape
        var positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        for (var i = 0; i < positions.length; i += 3) {
            var deform = 0.7 + Math.random() * 0.6;
            positions[i] *= deform;
            positions[i + 1] *= deform;
            positions[i + 2] *= deform;
        }
        mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);

        mesh.position = position.clone();
        mesh.material = createAsteroidMaterial();

        // Slight random rotation for tumbling
        mesh.rotationSpeed = new BABYLON.Vector3(
            (Math.random() - 0.5) * 0.03,
            (Math.random() - 0.5) * 0.03,
            (Math.random() - 0.5) * 0.03
        );

        var asteroidObj = {
            mesh: mesh,
            sizeKey: sizeKey,
            radius: radius,
            velocity: velocity || randomVelocity(),
            rotationSpeed: mesh.rotationSpeed
        };

        state.asteroids.push(asteroidObj);
        return asteroidObj;
    }

    function randomVelocity() {
        var speed = ASTEROID_MIN_SPEED + Math.random() * (ASTEROID_MAX_SPEED - ASTEROID_MIN_SPEED);
        var dir = new BABYLON.Vector3(
            Math.random() - 0.5,
            (Math.random() - 0.5) * 0.3,
            Math.random() - 0.5
        ).normalize();
        return dir.scale(speed);
    }

    function randomAsteroidPosition() {
        var pos;
        do {
            pos = new BABYLON.Vector3(
                (Math.random() - 0.5) * ARENA_SIZE,
                (Math.random() - 0.5) * ARENA_SIZE * 0.3,
                (Math.random() - 0.5) * ARENA_SIZE
            );
        } while (BABYLON.Vector3.Distance(pos, ship.position) < 40);
        return pos;
    }

    function spawnWave(count) {
        for (var i = 0; i < count; i++) {
            createAsteroid(randomAsteroidPosition(), "large");
        }
    }

    // ── Bullets ──
    function fireBullet() {
        if (state.fireCooldown > 0 || state.gameOver) return;
        state.fireCooldown = FIRE_COOLDOWN;

        var bullet = BABYLON.MeshBuilder.CreateSphere("bullet", { diameter: 0.6, segments: 6 }, scene);
        bullet.material = createBulletMaterial();

        // Forward direction of ship
        var forward = new BABYLON.Vector3(0, 0, 1);
        var rotMatrix = new BABYLON.Matrix();
        ship.getWorldMatrix().decompose(undefined, undefined, undefined);
        BABYLON.Matrix.RotationYawPitchRollToRef(ship.rotation.y, ship.rotation.x, ship.rotation.z, rotMatrix);
        var dir = BABYLON.Vector3.TransformNormal(forward, rotMatrix);

        bullet.position = ship.position.clone().add(dir.scale(4));

        var bulletObj = {
            mesh: bullet,
            velocity: dir.scale(BULLET_SPEED).add(state.shipVelocity.scale(0.3)),
            life: BULLET_LIFETIME
        };

        state.bullets.push(bulletObj);
    }

    // ── Particle Explosion ──
    function createExplosion(position, color, size) {
        var ps = new BABYLON.ParticleSystem("explosion", 150, scene);
        ps.particleTexture = null;
        ps.emitter = position.clone();
        ps.createSphereEmitter(size * 0.5);
        ps.color1 = new BABYLON.Color4(color.r, color.g, color.b, 1.0);
        ps.color2 = new BABYLON.Color4(color.r * 0.7, color.g * 0.7, color.b * 0.5, 0.8);
        ps.colorDead = new BABYLON.Color4(0.1, 0.05, 0.0, 0.0);
        ps.minSize = 0.3;
        ps.maxSize = size * 0.4;
        ps.minLifeTime = 0.3;
        ps.maxLifeTime = 0.8;
        ps.emitRate = 500;
        ps.minEmitPower = size * 0.5;
        ps.maxEmitPower = size * 2;
        ps.updateSpeed = 0.02;
        ps.targetStopDuration = 0.2;
        ps.disposeOnStop = true;
        ps.start();
    }

    // ── Wrap Position ──
    function wrapPosition(pos) {
        if (pos.x > HALF_ARENA) pos.x = -HALF_ARENA;
        else if (pos.x < -HALF_ARENA) pos.x = HALF_ARENA;
        if (pos.y > HALF_ARENA * 0.4) pos.y = -HALF_ARENA * 0.4;
        else if (pos.y < -HALF_ARENA * 0.4) pos.y = HALF_ARENA * 0.4;
        if (pos.z > HALF_ARENA) pos.z = -HALF_ARENA;
        else if (pos.z < -HALF_ARENA) pos.z = HALF_ARENA;
    }

    // ── HUD ──
    var advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

    var scoreText = new BABYLON.GUI.TextBlock("score");
    scoreText.text = "SCORE: 0";
    scoreText.color = "#00ccff";
    scoreText.fontSize = 28;
    scoreText.fontFamily = "Consolas, monospace";
    scoreText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
    scoreText.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
    scoreText.paddingLeft = "20px";
    scoreText.paddingTop = "20px";
    scoreText.outlineWidth = 2;
    scoreText.outlineColor = "#003366";
    advancedTexture.addControl(scoreText);

    var livesText = new BABYLON.GUI.TextBlock("lives");
    livesText.text = "LIVES: 3";
    livesText.color = "#00ff88";
    livesText.fontSize = 28;
    livesText.fontFamily = "Consolas, monospace";
    livesText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
    livesText.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
    livesText.paddingRight = "20px";
    livesText.paddingTop = "20px";
    livesText.outlineWidth = 2;
    livesText.outlineColor = "#003322";
    advancedTexture.addControl(livesText);

    var waveText = new BABYLON.GUI.TextBlock("wave");
    waveText.text = "WAVE 1";
    waveText.color = "#ffaa00";
    waveText.fontSize = 24;
    waveText.fontFamily = "Consolas, monospace";
    waveText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_CENTER;
    waveText.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
    waveText.paddingTop = "20px";
    waveText.outlineWidth = 2;
    waveText.outlineColor = "#553300";
    advancedTexture.addControl(waveText);

    // Game over overlay
    var gameOverPanel = new BABYLON.GUI.Rectangle("gameOverPanel");
    gameOverPanel.width = "500px";
    gameOverPanel.height = "300px";
    gameOverPanel.cornerRadius = 10;
    gameOverPanel.color = "#00ccff";
    gameOverPanel.thickness = 2;
    gameOverPanel.background = "rgba(0, 10, 30, 0.85)";
    gameOverPanel.isVisible = false;
    advancedTexture.addControl(gameOverPanel);

    var gameOverTitle = new BABYLON.GUI.TextBlock("gameOverTitle");
    gameOverTitle.text = "GAME OVER";
    gameOverTitle.color = "#ff3333";
    gameOverTitle.fontSize = 48;
    gameOverTitle.fontFamily = "Consolas, monospace";
    gameOverTitle.top = "-60px";
    gameOverTitle.outlineWidth = 3;
    gameOverTitle.outlineColor = "#660000";
    gameOverPanel.addControl(gameOverTitle);

    var gameOverScore = new BABYLON.GUI.TextBlock("gameOverScore");
    gameOverScore.text = "FINAL SCORE: 0";
    gameOverScore.color = "#00ccff";
    gameOverScore.fontSize = 30;
    gameOverScore.fontFamily = "Consolas, monospace";
    gameOverScore.top = "10px";
    gameOverPanel.addControl(gameOverScore);

    var restartText = new BABYLON.GUI.TextBlock("restartText");
    restartText.text = "Press R to Restart";
    restartText.color = "#aaaaaa";
    restartText.fontSize = 22;
    restartText.fontFamily = "Consolas, monospace";
    restartText.top = "70px";
    gameOverPanel.addControl(restartText);

    // Wave announcement
    var waveAnnounce = new BABYLON.GUI.TextBlock("waveAnnounce");
    waveAnnounce.text = "";
    waveAnnounce.color = "#ffaa00";
    waveAnnounce.fontSize = 50;
    waveAnnounce.fontFamily = "Consolas, monospace";
    waveAnnounce.alpha = 0;
    waveAnnounce.outlineWidth = 3;
    waveAnnounce.outlineColor = "#553300";
    advancedTexture.addControl(waveAnnounce);
    var waveAnnounceTimer = 0;

    function showWaveAnnouncement(waveNum) {
        waveAnnounce.text = "WAVE " + waveNum;
        waveAnnounce.alpha = 1;
        waveAnnounceTimer = 120;
    }

    // ── Input ──
    window.addEventListener("keydown", function (e) {
        state.keys[e.code] = true;
        if (e.code === "Space") e.preventDefault();
    });
    window.addEventListener("keyup", function (e) {
        state.keys[e.code] = false;
    });

    // ── Reset / Restart ──
    function resetGame() {
        // Clear asteroids
        for (var i = 0; i < state.asteroids.length; i++) {
            state.asteroids[i].mesh.dispose();
        }
        state.asteroids = [];

        // Clear bullets
        for (var i = 0; i < state.bullets.length; i++) {
            state.bullets[i].mesh.dispose();
        }
        state.bullets = [];

        // Reset state
        state.score = 0;
        state.lives = STARTING_LIVES;
        state.wave = 1;
        state.gameOver = false;
        state.shipInvuln = 0;
        state.fireCooldown = 0;
        state.shipVelocity = new BABYLON.Vector3(0, 0, 0);

        // Reset ship
        ship.position = BABYLON.Vector3.Zero();
        ship.rotation = BABYLON.Vector3.Zero();

        // Hide game over
        gameOverPanel.isVisible = false;

        // Spawn first wave
        spawnWave(INITIAL_ASTEROIDS);
        showWaveAnnouncement(1);

        updateHUD();
    }

    function updateHUD() {
        scoreText.text = "SCORE: " + state.score;
        livesText.text = "LIVES: " + state.lives;
        waveText.text = "WAVE " + state.wave;
    }

    function loseLife() {
        state.lives--;
        state.shipInvuln = SHIP_INVULN_TIME;
        state.shipVelocity = BABYLON.Vector3.Zero();
        ship.position = BABYLON.Vector3.Zero();
        ship.rotation = BABYLON.Vector3.Zero();

        createExplosion(ship.position, new BABYLON.Color3(0.2, 0.5, 1.0), 5);

        if (state.lives <= 0) {
            state.gameOver = true;
            gameOverScore.text = "FINAL SCORE: " + state.score;
            gameOverPanel.isVisible = true;
        }
        updateHUD();
    }

    function destroyAsteroid(index, bulletVelocity) {
        var asteroid = state.asteroids[index];
        var pos = asteroid.mesh.position.clone();
        var sizeKey = asteroid.sizeKey;
        var matColor = asteroid.mesh.material.diffuseColor;

        state.score += ASTEROID_POINTS[sizeKey];

        createExplosion(pos, matColor, asteroid.radius);

        asteroid.mesh.dispose();
        state.asteroids.splice(index, 1);

        // Split into smaller asteroids
        var childSize = null;
        var childCount = 0;
        if (sizeKey === "large") {
            childSize = "medium";
            childCount = 2 + Math.floor(Math.random() * 2); // 2-3
        } else if (sizeKey === "medium") {
            childSize = "small";
            childCount = 2 + Math.floor(Math.random() * 2); // 2-3
        }

        if (childSize) {
            for (var i = 0; i < childCount; i++) {
                var offset = new BABYLON.Vector3(
                    (Math.random() - 0.5) * asteroid.radius,
                    (Math.random() - 0.5) * asteroid.radius * 0.5,
                    (Math.random() - 0.5) * asteroid.radius
                );
                var newVel = randomVelocity();
                if (bulletVelocity) {
                    newVel = newVel.add(bulletVelocity.scale(0.1));
                }
                createAsteroid(pos.add(offset), childSize, newVel);
            }
        }

        updateHUD();

        // Check for wave completion
        if (state.asteroids.length === 0) {
            state.wave++;
            var count = INITIAL_ASTEROIDS + state.wave * 2;
            spawnWave(count);
            showWaveAnnouncement(state.wave);
            updateHUD();
        }
    }

    // ── Game Loop ──
    scene.registerBeforeRender(function () {
        if (state.gameOver) {
            if (state.keys["KeyR"]) {
                resetGame();
            }
            return;
        }

        var k = state.keys;
        var dt = engine.getDeltaTime() / 16.67; // normalize to ~60fps

        // ── Ship Controls ──
        // Rotation
        if (k["KeyA"] || k["ArrowLeft"]) {
            ship.rotation.y -= SHIP_ROTATE_SPEED * dt;
        }
        if (k["KeyD"] || k["ArrowRight"]) {
            ship.rotation.y += SHIP_ROTATE_SPEED * dt;
        }

        // Forward direction
        var forward = new BABYLON.Vector3(
            Math.sin(ship.rotation.y),
            0,
            Math.cos(ship.rotation.y)
        );

        // Thrust
        var thrusting = false;
        if (k["KeyW"] || k["ArrowUp"]) {
            state.shipVelocity.addInPlace(forward.scale(SHIP_THRUST * dt));
            thrusting = true;
        }
        if (k["KeyS"] || k["ArrowDown"]) {
            state.shipVelocity.addInPlace(forward.scale(-SHIP_BRAKE * dt));
        }

        // Clamp speed
        var speed = state.shipVelocity.length();
        if (speed > SHIP_MAX_SPEED) {
            state.shipVelocity.normalize().scaleInPlace(SHIP_MAX_SPEED);
        }

        // Drag
        state.shipVelocity.scaleInPlace(0.995);

        // Apply velocity
        ship.position.addInPlace(state.shipVelocity.scale(dt));
        wrapPosition(ship.position);

        // Update point light
        pointLight.position = ship.position.clone();

        // Engine exhaust particles
        exhaustSystem.emitRate = thrusting ? 120 : 0;

        // Ship invulnerability flicker
        if (state.shipInvuln > 0) {
            state.shipInvuln--;
            var visible = Math.floor(state.shipInvuln / 6) % 2 === 0;
            ship.getChildMeshes().forEach(function (m) { m.isVisible = visible; });
        } else {
            ship.getChildMeshes().forEach(function (m) { m.isVisible = true; });
        }

        // Fire
        if (k["Space"]) {
            fireBullet();
        }
        if (state.fireCooldown > 0) state.fireCooldown--;

        // ── Update Bullets ──
        for (var i = state.bullets.length - 1; i >= 0; i--) {
            var b = state.bullets[i];
            b.mesh.position.addInPlace(b.velocity.scale(dt));
            b.life -= dt;
            if (b.life <= 0) {
                b.mesh.dispose();
                state.bullets.splice(i, 1);
            }
        }

        // ── Update Asteroids ──
        for (var i = 0; i < state.asteroids.length; i++) {
            var a = state.asteroids[i];
            a.mesh.position.addInPlace(a.velocity.scale(dt));
            a.mesh.rotation.x += a.rotationSpeed.x * dt;
            a.mesh.rotation.y += a.rotationSpeed.y * dt;
            a.mesh.rotation.z += a.rotationSpeed.z * dt;
            wrapPosition(a.mesh.position);
        }

        // ── Collision: Bullet vs Asteroid ──
        for (var bi = state.bullets.length - 1; bi >= 0; bi--) {
            var bullet = state.bullets[bi];
            var hit = false;
            for (var ai = state.asteroids.length - 1; ai >= 0; ai--) {
                var ast = state.asteroids[ai];
                var dist = BABYLON.Vector3.Distance(bullet.mesh.position, ast.mesh.position);
                if (dist < ast.radius + 0.5) {
                    destroyAsteroid(ai, bullet.velocity);
                    bullet.mesh.dispose();
                    state.bullets.splice(bi, 1);
                    hit = true;
                    break;
                }
            }
            if (hit) continue;
        }

        // ── Collision: Ship vs Asteroid ──
        if (state.shipInvuln <= 0) {
            for (var ai = state.asteroids.length - 1; ai >= 0; ai--) {
                var ast = state.asteroids[ai];
                var dist = BABYLON.Vector3.Distance(ship.position, ast.mesh.position);
                if (dist < ast.radius + ship.colliderRadius) {
                    loseLife();
                    break;
                }
            }
        }

        // ── Wave Announcement Fade ──
        if (waveAnnounceTimer > 0) {
            waveAnnounceTimer--;
            if (waveAnnounceTimer < 30) {
                waveAnnounce.alpha = waveAnnounceTimer / 30;
            }
        }
    });

    // ── Start ──
    spawnWave(INITIAL_ASTEROIDS);
    showWaveAnnouncement(1);
    updateHUD();

    engine.runRenderLoop(function () {
        scene.render();
    });

    window.addEventListener("resize", function () {
        engine.resize();
    });
})();
</script>
</body>
</html>
