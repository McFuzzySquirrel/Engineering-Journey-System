services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: decision_graph
      POSTGRES_USER: decision_graph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decision_graph_local}
    ports:
      - "127.0.0.1:${DG_PG_PORT:-5432}:5432"
    volumes:
      - decision-graph-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decision_graph -d decision_graph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  decision-graph-postgres:
