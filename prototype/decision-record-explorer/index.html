<!doctype html>
<!-- Prototype plan: three structurally different record-explorer layouts, switchable with ?variant=A|B|C. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision Graph — Explorer Prototype</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #182331;
        background: #f3f5f7;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        padding-bottom: 90px;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button,
      select,
      input {
        border: 1px solid #cbd3dc;
        border-radius: 8px;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #6bb8e8;
        outline-offset: 2px;
      }

      .prototype-banner {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 6px 12px;
        color: #fff;
        background: #672d91;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .prototype-banner span {
        opacity: 0.75;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 62px;
        padding: 12px 24px;
        border-bottom: 1px solid #dce2e8;
        background: #fff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 800;
        white-space: nowrap;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 9px;
        color: white;
        background: #315f8d;
        font-size: 15px;
      }

      .top-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #637181;
        font-size: 12px;
      }

      .sample-pill,
      .status,
      .type-pill,
      .tag {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      .sample-pill {
        padding: 5px 9px;
        color: #664314;
        background: #fff0c7;
      }

      .page {
        min-height: calc(100vh - 94px);
      }

      .filters {
        display: grid;
        gap: 12px;
      }

      .filter-field {
        display: grid;
        gap: 5px;
        color: #647183;
        font-size: 11px;
        font-weight: 750;
      }

      .filter-field select,
      .filter-field input {
        width: 100%;
        min-height: 36px;
        padding: 7px 9px;
        color: #1c2a39;
        background: #fff;
        font-size: 12px;
      }

      .filter-field select[multiple] {
        min-height: 76px;
        padding: 4px;
      }

      .hint {
        color: #8792a0;
        font-size: 11px;
        line-height: 1.45;
      }

      .search-form {
        display: flex;
        width: 100%;
        min-width: 0;
        gap: 8px;
      }

      .search-form input {
        flex: 1;
        width: 0;
        min-width: 0;
        min-height: 40px;
        padding: 9px 12px;
        color: #1c2a39;
        background: white;
      }

      .search-form button,
      .primary-button {
        min-height: 40px;
        padding: 8px 13px;
        border-color: #315f8d;
        color: white;
        background: #315f8d;
        font-size: 12px;
        font-weight: 750;
      }

      .results-summary {
        color: #738091;
        font-size: 12px;
      }

      .record-id {
        color: #627184;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }

      .record-title {
        margin: 0;
        color: inherit;
        font-size: 15px;
        line-height: 1.35;
      }

      .record-meta,
      .record-pills,
      .relationship-list {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .status,
      .type-pill,
      .tag {
        padding: 4px 8px;
      }

      .type-pill {
        color: #465b70;
        background: #e8eef4;
      }

      .tag {
        color: #58677a;
        background: #f0f2f5;
      }

      .status-accepted {
        color: #166c4a;
        background: #dff4e9;
      }

      .status-proposed {
        color: #8a5a06;
        background: #fff0ce;
      }

      .status-superseded,
      .status-deprecated,
      .status-discarded {
        color: #646e7b;
        background: #e8ebef;
      }

      .status-open {
        color: #8051a4;
        background: #f0e4fb;
      }

      .status-promoted {
        color: #275ba2;
        background: #e1edff;
      }

      .record-card,
      .record-row,
      .relation-link {
        color: inherit;
        text-align: left;
      }

      .record-card {
        display: grid;
        gap: 9px;
        width: 100%;
        padding: 14px;
        border: 1px solid #dce2e8;
        border-radius: 12px;
        background: white;
        box-shadow: 0 2px 8px rgb(26 42 59 / 4%);
      }

      .record-card:hover,
      .record-row:hover {
        border-color: #76a8d1;
      }

      .record-card.is-selected,
      .record-row.is-selected {
        border-color: #3e7aaa;
        box-shadow: 0 0 0 2px rgb(62 122 170 / 14%);
      }

      .record-excerpt {
        margin: 0;
        color: #677587;
        font-size: 12px;
        line-height: 1.55;
      }

      .project-name {
        color: #69788a;
        font-size: 11px;
        font-weight: 700;
      }

      .empty-state {
        padding: 28px;
        border: 1px dashed #c7d0da;
        border-radius: 12px;
        color: #6c7988;
        background: rgb(255 255 255 / 55%);
        text-align: center;
      }

      .detail-heading {
        display: grid;
        gap: 9px;
      }

      .detail-heading h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .detail-content {
        color: #344253;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .detail-content p {
        margin: 0 0 12px;
      }

      .detail-section {
        display: grid;
        gap: 9px;
        padding-top: 16px;
        border-top: 1px solid #e5e9ee;
      }

      .detail-section h2 {
        margin: 0;
        color: #69788a;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .relation-link {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 6px 8px;
        border: 1px solid #dbe2e9;
        border-radius: 7px;
        background: #fff;
        font-size: 11px;
      }

      .relation-link span {
        color: #728091;
      }

      .prototype-switcher {
        position: fixed;
        z-index: 20;
        bottom: 16px;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 6px 9px;
        border: 1px solid #303d4c;
        border-radius: 999px;
        color: #fff;
        background: #182331;
        box-shadow: 0 8px 28px rgb(0 0 0 / 24%);
        transform: translateX(-50%);
      }

      .prototype-switcher button {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: white;
        background: #34465b;
        font-size: 17px;
      }

      .prototype-switcher button:hover {
        background: #46617d;
      }

      .variant-label {
        min-width: 180px;
        font-size: 12px;
        font-weight: 750;
        text-align: center;
      }

      .variant-label span {
        color: #aab6c4;
        font-weight: 500;
      }

      .layout-a {
        color: #d9e3ed;
        background: #101923;
      }

      .layout-a .topbar {
        border-color: #263342;
        color: #ecf4fb;
        background: #172330;
      }

      .layout-a .brand-mark {
        background: #3675a8;
      }

      .layout-a .top-meta {
        color: #9baabd;
      }

      .workbench {
        display: grid;
        min-height: calc(100vh - 94px);
        grid-template-columns: 228px minmax(330px, 1fr) minmax(320px, 0.88fr);
      }

      .workbench-sidebar {
        display: grid;
        align-content: start;
        gap: 20px;
        padding: 18px 14px 28px;
        border-right: 1px solid #263342;
        background: #141f2b;
      }

      .workbench-sidebar h2,
      .lane-title {
        margin: 0;
        color: #93a4b7;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .workbench-sidebar .filter-field {
        color: #9eacbb;
      }

      .workbench-sidebar .filter-field select,
      .workbench-sidebar .filter-field input {
        border-color: #354454;
        color: #e4edf6;
        background: #1c2a39;
      }

      .workbench-sidebar .filter-field select option {
        background: #1c2a39;
      }

      .workbench-sidebar .hint {
        color: #77899b;
      }

      .sidebar-group {
        display: grid;
        gap: 11px;
      }

      .workbench-results {
        padding: 20px;
        border-right: 1px solid #263342;
      }

      .workbench-results-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .workbench-results-header h1 {
        margin: 0;
        font-size: 18px;
      }

      .workbench-list {
        display: grid;
        gap: 8px;
      }

      .record-row {
        display: grid;
        gap: 8px;
        width: 100%;
        padding: 12px;
        border: 1px solid #293847;
        border-radius: 9px;
        color: #e4edf6;
        background: #172330;
      }

      .record-row .record-title {
        font-size: 13px;
      }

      .record-row .record-id,
      .record-row .project-name {
        color: #94a6b9;
      }

      .record-row .record-excerpt {
        color: #a9b6c4;
      }

      .workbench-detail {
        display: grid;
        align-content: start;
        gap: 19px;
        padding: 24px 20px 32px;
        color: #dde7f0;
        background: #111b25;
      }

      .workbench-detail .detail-heading h1 {
        font-size: 20px;
      }

      .workbench-detail .detail-content {
        color: #c0cbd7;
      }

      .workbench-detail .detail-section {
        border-color: #2b3947;
      }

      .workbench-detail .detail-section h2 {
        color: #90a1b2;
      }

      .workbench-detail .relation-link {
        border-color: #334556;
        color: #dce7f1;
        background: #1a2937;
      }

      .layout-b {
        color: #1d2a36;
        background: #f5f2ec;
      }

      .layout-b .topbar {
        border-color: #e3ded4;
        background: #fffdf8;
      }

      .library-page {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 24px 38px;
      }

      .library-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      .library-heading h1 {
        margin: 0 0 5px;
        color: #253b4b;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 500;
      }

      .library-heading p {
        margin: 0;
        color: #77827d;
        font-size: 13px;
      }

      .library-search {
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid #e3ded4;
        border-radius: 12px;
        background: #fffdf8;
      }

      .library-search .filters {
        grid-template-columns: repeat(4, minmax(120px, 1fr));
      }

      .library-content {
        display: grid;
        grid-template-columns: minmax(290px, 0.75fr) minmax(420px, 1.25fr);
        gap: 20px;
        margin-top: 20px;
        align-items: start;
      }

      .library-results {
        display: grid;
        gap: 9px;
      }

      .library-results .record-card {
        border-color: #e4ded3;
        border-radius: 8px;
        box-shadow: none;
      }

      .library-results .record-title {
        color: #253b4b;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 500;
      }

      .reading-pane {
        position: sticky;
        top: 12px;
        display: grid;
        gap: 18px;
        min-height: 440px;
        padding: 26px;
        border: 1px solid #e2ddd3;
        border-radius: 12px;
        background: #fffdf8;
        box-shadow: 0 8px 28px rgb(63 59 47 / 6%);
      }

      .reading-pane .detail-heading h1 {
        color: #253b4b;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 30px;
        font-weight: 500;
      }

      .reading-pane .detail-content {
        color: #45535b;
      }

      .reading-pane .detail-section {
        border-color: #e7e1d6;
      }

      .library-back {
        display: none;
      }

      .layout-c {
        color: #233126;
        background: #edf1e9;
      }

      .layout-c .topbar {
        border-color: #d7dfd2;
        background: #f8faf5;
      }

      .board-page {
        padding: 20px 18px 34px;
      }

      .board-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin: 0 auto 16px;
        max-width: 1500px;
      }

      .board-heading h1 {
        margin: 0;
        color: #38563c;
        font-size: 22px;
      }

      .board-controls {
        display: grid;
        gap: 10px;
        max-width: 1500px;
        margin: 0 auto 18px;
        padding: 12px;
        border: 1px solid #d7dfd2;
        border-radius: 12px;
        background: #f8faf5;
      }

      .board-controls .filters {
        grid-template-columns: repeat(5, minmax(120px, 1fr));
      }

      .status-board {
        display: grid;
        max-width: 1500px;
        margin: 0 auto;
        grid-template-columns: repeat(4, minmax(235px, 1fr));
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .status-lane {
        display: grid;
        align-content: start;
        gap: 9px;
        min-height: 320px;
        padding: 11px;
        border: 1px solid #d5ddd0;
        border-radius: 12px;
        background: #e4eae0;
      }

      .lane-header {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        padding: 2px 2px 8px;
        border-bottom: 1px solid #d0d9cb;
      }

      .lane-count {
        display: grid;
        min-width: 23px;
        height: 23px;
        place-items: center;
        border-radius: 50%;
        color: #647164;
        background: #d4ddcf;
        font-size: 11px;
        font-weight: 800;
      }

      .status-lane .record-card {
        padding: 11px;
        border-color: #d6ded2;
        border-radius: 9px;
        box-shadow: 0 2px 6px rgb(44 61 43 / 5%);
      }

      .status-lane .record-title {
        font-size: 13px;
      }

      .board-detail-drawer {
        position: fixed;
        z-index: 10;
        top: 95px;
        right: 16px;
        bottom: 78px;
        display: none;
        width: min(430px, calc(100vw - 32px));
        overflow-y: auto;
        align-content: start;
        gap: 16px;
        padding: 20px;
        border: 1px solid #d5ddd0;
        border-radius: 14px;
        background: #fbfcf8;
        box-shadow: 0 16px 50px rgb(33 53 33 / 24%);
      }

      .board-detail-drawer.is-open {
        display: grid;
      }

      .drawer-close {
        justify-self: end;
        padding: 6px 9px;
        border-color: #d0d8ca;
        color: #526251;
        background: #f1f5ed;
        font-size: 12px;
      }

      .layout-c .detail-heading h1 {
        color: #36563b;
        font-size: 22px;
      }

      @media (max-width: 1050px) {
        .workbench {
          grid-template-columns: 200px minmax(300px, 1fr);
        }

        .workbench-detail {
          grid-column: 1 / -1;
          border-top: 1px solid #263342;
        }

        .library-content {
          grid-template-columns: minmax(230px, 0.8fr) minmax(340px, 1.2fr);
        }
      }

      @media (max-width: 740px) {
        .topbar {
          padding: 10px 14px;
        }

        .top-meta .hint {
          display: none;
        }

        .workbench {
          grid-template-columns: 1fr;
        }

        .workbench-sidebar {
          border-right: 0;
          border-bottom: 1px solid #263342;
          grid-template-columns: 1fr 1fr;
        }

        .workbench-sidebar > .hint {
          grid-column: 1 / -1;
        }

        .workbench-results {
          border-right: 0;
        }

        .workbench-detail {
          grid-column: auto;
        }

        .library-page,
        .board-page {
          padding: 18px 12px 28px;
        }

        .library-heading,
        .board-heading {
          align-items: start;
          flex-direction: column;
        }

        .library-search .filters,
        .board-controls .filters {
          grid-template-columns: repeat(2, minmax(120px, 1fr));
        }

        .library-content {
          grid-template-columns: 1fr;
        }

        .reading-pane {
          position: static;
          min-height: 0;
        }

        .library-content.is-detail .library-results {
          display: none;
        }

        .library-content.is-detail .reading-pane {
          order: -1;
        }

        .library-back {
          display: inline-flex;
          width: fit-content;
        }

        .status-board {
          grid-template-columns: repeat(4, minmax(250px, 1fr));
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .prototype-switcher button,
        .record-card,
        .record-row {
          transition:
            transform 120ms ease,
            border-color 120ms ease,
            background 120ms ease;
        }

        .record-card:hover {
          transform: translateY(-1px);
        }
      }
    </style>
  </head>
  <body>
    <div class="prototype-banner">
      Throwaway UI prototype
      <span>Mock records only · no API calls or writes</span>
    </div>
    <div id="app"></div>
    <nav class="prototype-switcher" aria-label="Prototype layout variations">
      <button type="button" data-variant-step="-1" aria-label="Previous layout">
        ‹
      </button>
      <div class="variant-label" id="variant-label" aria-live="polite"></div>
      <button type="button" data-variant-step="1" aria-label="Next layout">
        ›
      </button>
    </nav>

    <script>
      const projects = [
        { id: "decision-graph", name: "Decision Graph", type: "cli-tool" },
        { id: "atlas-api", name: "Atlas API", type: "service" },
        { id: "studio-web", name: "Studio Web", type: "web-app" },
      ];

      const records = [
        {
          projectId: "decision-graph",
          id: "ADR-0001",
          type: "adr",
          status: "accepted",
          title: "Pivot from session logs to a decision graph",
          date: "2026-10-14",
          tags: ["project-direction", "architecture"],
          path: "docs/decisions/adr/ADR-0001-pivot.md",
          excerpt:
            "Keep durable decisions discoverable, scoped, and verifiable. Treat versioned Markdown as the source of truth.",
          body:
            "## Decision\n\nUse a searchable, scoped decision graph instead of recording entire engineering sessions.\n\n## Why\n\nDecisions are easier to find and reuse than long session narratives.",
        },
        {
          projectId: "decision-graph",
          id: "ADR-0002",
          type: "adr",
          status: "accepted",
          title: "Use SQLite for the local decision index",
          date: "2026-10-14",
          tags: ["storage", "local-first"],
          path: "docs/decisions/adr/ADR-0002-local-store.md",
          excerpt:
            "The local graph index is rebuildable and keeps the CLI useful without a server.",
          body:
            "## Decision\n\nUse SQLite with FTS5 for the local store.\n\n## Consequence\n\nThe Markdown records remain canonical; the database can be rebuilt.",
        },
        {
          projectId: "decision-graph",
          id: "ADR-0003",
          type: "adr",
          status: "proposed",
          title: "Serve the local browser UI from dg serve",
          date: "2026-10-15",
          tags: ["server", "browser-ui"],
          path: "docs/decisions/adr/ADR-0003-local-ui.md",
          excerpt:
            "A same-origin UI can reuse the local HTTP service and its existing project database.",
          body:
            "## Proposal\n\nServe the production UI assets from the local HTTP process.\n\n## Open question\n\nHow should project filters and search results be ordered?",
        },
        {
          projectId: "decision-graph",
          id: "SDR-20261014-010",
          type: "sdr",
          status: "open",
          date: "2026-10-14",
          title: "Serve the browser UI from dg serve",
          tags: ["browser-ui", "server"],
          path: "docs/decisions/sdr/SDR-010-ui-serving.md",
          excerpt:
            "Use the existing server for production assets and Vite with a local API proxy during development.",
          body:
            "## Decision\n\nServe built UI assets from dg serve at the API origin.\n\n## Why\n\nOne local production process avoids cross-origin requests.",
        },
        {
          projectId: "decision-graph",
          id: "SDR-20261014-011",
          type: "sdr",
          status: "open",
          date: "2026-10-14",
          title: "Define cross-project search and record filters",
          tags: ["browser-ui", "search"],
          path: "docs/decisions/sdr/SDR-011-search.md",
          excerpt:
            "Search every configured project by default, with explicit project and record facets.",
          body:
            "## Decision\n\nUse server-side facets and relevance-ranked full-text results.\n\n## Behavior\n\nAn empty query shows the title-sorted record list.",
        },
        {
          projectId: "atlas-api",
          id: "ADR-0010",
          type: "adr",
          status: "accepted",
          title: "Require idempotency keys for write requests",
          date: "2026-09-22",
          tags: ["api", "reliability"],
          path: "decisions/ADR-0010-idempotency.md",
          excerpt:
            "Clients can safely retry writes when the service records each operation key.",
          body:
            "## Decision\n\nRequire an idempotency key on payment and provisioning writes.\n\n## Consequence\n\nRetries return the original outcome rather than performing a second write.",
        },
        {
          projectId: "atlas-api",
          id: "ADR-0011",
          type: "adr",
          status: "proposed",
          title: "Separate public and internal API rate limits",
          date: "2026-10-02",
          tags: ["api", "operations"],
          path: "decisions/ADR-0011-rate-limits.md",
          excerpt:
            "Different caller classes may need separate budgets and operational alerts.",
          body:
            "## Proposal\n\nDefine separate request budgets for public and internal clients.\n\n## Question\n\nShould internal traffic have a higher burst limit?",
        },
        {
          projectId: "atlas-api",
          id: "SDR-20261009-002",
          type: "sdr",
          status: "discarded",
          date: "2026-10-09",
          title: "Keep the legacy webhook retry window",
          tags: ["webhooks", "reliability"],
          path: "decisions/sdr/SDR-002-webhook-window.md",
          excerpt:
            "A proposed extension was discarded after checking partner retry contracts.",
          body:
            "## Decision\n\nKeep the existing retry window.\n\n## Why\n\nPartner contracts already assume the current timing.",
        },
        {
          projectId: "studio-web",
          id: "ADR-0020",
          type: "adr",
          status: "accepted",
          title: "Use URL state for shareable filters",
          date: "2026-09-18",
          tags: ["frontend", "navigation"],
          path: "docs/adr/ADR-0020-url-state.md",
          excerpt:
            "Search and filter state can be bookmarked and shared when it lives in the URL.",
          body:
            "## Decision\n\nSerialize shareable filter state in URL search parameters.\n\n## Consequence\n\nReloading or sharing a URL restores the current view.",
        },
        {
          projectId: "studio-web",
          id: "ADR-0021",
          type: "adr",
          status: "superseded",
          title: "Store dashboard filters in local storage",
          date: "2026-07-13",
          tags: ["frontend", "navigation"],
          path: "docs/adr/ADR-0021-local-filters.md",
          excerpt:
            "This earlier choice was replaced because saved filters could not be shared.",
          body:
            "## Decision\n\nStore dashboard filters in local storage.\n\n## Status\n\nSuperseded by URL-backed filter state.",
        },
        {
          projectId: "studio-web",
          id: "SDR-20261002-001",
          type: "sdr",
          status: "promoted",
          date: "2026-10-02",
          title: "Add keyboard shortcuts to the record list",
          tags: ["accessibility", "navigation"],
          path: "docs/decisions/sdr/SDR-001-keyboard-shortcuts.md",
          excerpt:
            "The session decision was promoted into a proposed architecture decision.",
          body:
            "## Decision\n\nUse keyboard shortcuts for common list navigation.\n\n## Follow-up\n\nReview the shortcut map with assistive technology users.",
        },
      ];

      const edges = [
        {
          projectId: "decision-graph",
          src: "ADR-0001",
          dst: "ADR-0002",
          kind: "relates_to",
        },
        {
          projectId: "decision-graph",
          src: "ADR-0001",
          dst: "SDR-20261014-010",
          kind: "derived_from",
        },
        {
          projectId: "decision-graph",
          src: "ADR-0003",
          dst: "SDR-20261014-010",
          kind: "relates_to",
        },
        {
          projectId: "decision-graph",
          src: "SDR-20261014-011",
          dst: "SDR-20261014-010",
          kind: "relates_to",
        },
        {
          projectId: "atlas-api",
          src: "ADR-0010",
          dst: "ADR-0011",
          kind: "relates_to",
        },
        {
          projectId: "studio-web",
          src: "ADR-0021",
          dst: "ADR-0020",
          kind: "supersedes",
        },
      ];

      const variations = [
        { id: "A", name: "Workbench" },
        { id: "B", name: "Reading room" },
        { id: "C", name: "Status board" },
      ];

      const state = {
        project: "all",
        type: "all",
        status: "all",
        tags: [],
        query: "",
        selected: "decision-graph:ADR-0001",
        mobileDetail: false,
      };

      const app = document.querySelector("#app");
      const variantLabel = document.querySelector("#variant-label");
      const recordMap = new Map(
        records.map((record) => [
          `${record.projectId}:${record.id}`,
          record,
        ]),
      );

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          const escapes = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          };
          return escapes[character];
        });
      }

      function currentVariant() {
        const id = new URLSearchParams(window.location.search).get("variant");
        return variations.some((item) => item.id === id) ? id : "A";
      }

      function projectName(id) {
        return projects.find((project) => project.id === id)?.name ?? id;
      }

      function selectedRecord() {
        return recordMap.get(state.selected) ?? records[0];
      }

      function visibleRecords() {
        const terms = state.query
          .toLocaleLowerCase()
          .trim()
          .split(/\s+/)
          .filter(Boolean);

        const filtered = records.filter((record) => {
          if (state.project !== "all" && record.projectId !== state.project) {
            return false;
          }
          if (state.type !== "all" && record.type !== state.type) return false;
          if (state.status !== "all" && record.status !== state.status) {
            return false;
          }
          if (
            state.tags.length &&
            !state.tags.some((tag) => record.tags.includes(tag))
          ) {
            return false;
          }
          const searchable =
            `${record.title} ${record.body}`.toLocaleLowerCase();
          return terms.every((term) => searchable.includes(term));
        });

        if (terms.length) {
          return filtered.sort((first, second) => {
            const score = (record) =>
              terms.reduce(
                (total, term) =>
                  total +
                  (record.title.toLocaleLowerCase().includes(term) ? 3 : 0) +
                  (record.body.toLocaleLowerCase().split(term).length - 1),
                0,
              );
            return (
              score(second) - score(first) ||
              first.id.localeCompare(second.id)
            );
          });
        }

        return filtered.sort((first, second) =>
          first.title.localeCompare(second.title),
        );
      }

      function projectOptions() {
        return [
          `<option value="all"${state.project === "all" ? " selected" : ""}>All projects</option>`,
          ...projects.map(
            (project) =>
              `<option value="${escapeHtml(project.id)}"${state.project === project.id ? " selected" : ""}>${escapeHtml(project.name)}</option>`,
          ),
        ].join("");
      }

      function facetSelect(name, label, values, selected) {
        return `<label class="filter-field">${label}<select data-filter="${name}">${values
          .map(
            (value) =>
              `<option value="${escapeHtml(value.value)}"${value.value === selected ? " selected" : ""}>${escapeHtml(value.label)}</option>`,
          )
          .join("")}</select></label>`;
      }

      function filtersMarkup({ compact = false } = {}) {
        const tags = [...new Set(records.flatMap((record) => record.tags))].sort();
        const typeValues = [
          { value: "all", label: "All record types" },
          { value: "adr", label: "ADR" },
          { value: "sdr", label: "SDR" },
        ];
        const statuses = [
          { value: "all", label: "All statuses" },
          ...[...new Set(records.map((record) => record.status))]
            .sort()
            .map((status) => ({
              value: status,
              label: status[0].toUpperCase() + status.slice(1),
            })),
        ];
        return `<div class="filters${compact ? " compact-filters" : ""}">
          <label class="filter-field">Project<select data-filter="project">${projectOptions()}</select></label>
          ${facetSelect("type", "Record type", typeValues, state.type)}
          ${facetSelect("status", "Status", statuses, state.status)}
          <label class="filter-field">Tags<select data-filter="tags" multiple aria-label="Filter by tags">${tags
            .map(
              (tag) =>
                `<option value="${escapeHtml(tag)}"${state.tags.includes(tag) ? " selected" : ""}>${escapeHtml(tag)}</option>`,
            )
            .join("")}</select></label>
        </div>`;
      }

      function statusPill(status) {
        return `<span class="status status-${escapeHtml(status)}">${escapeHtml(status)}</span>`;
      }

      function recordCard(record, variantClass = "") {
        const selected =
          state.selected === `${record.projectId}:${record.id}`;
        return `<button type="button" class="record-card ${variantClass}${selected ? " is-selected" : ""}" data-record="${escapeHtml(record.projectId)}:${escapeHtml(record.id)}">
          <div class="record-meta"><span class="record-id">${escapeHtml(record.id)}</span>${statusPill(record.status)}<span class="type-pill">${escapeHtml(record.type.toUpperCase())}</span></div>
          <h2 class="record-title">${escapeHtml(record.title)}</h2>
          <div class="project-name">${escapeHtml(projectName(record.projectId))} · ${escapeHtml(record.date)}</div>
          <p class="record-excerpt">${escapeHtml(record.excerpt)}</p>
          <div class="record-pills">${record.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </button>`;
      }

      function recordRow(record) {
        const selected =
          state.selected === `${record.projectId}:${record.id}`;
        return `<button type="button" class="record-row${selected ? " is-selected" : ""}" data-record="${escapeHtml(record.projectId)}:${escapeHtml(record.id)}">
          <div class="record-meta"><span class="record-id">${escapeHtml(record.id)}</span>${statusPill(record.status)}<span class="type-pill">${escapeHtml(record.type.toUpperCase())}</span></div>
          <h2 class="record-title">${escapeHtml(record.title)}</h2>
          <div class="project-name">${escapeHtml(projectName(record.projectId))} · ${escapeHtml(record.date)}</div>
          <p class="record-excerpt">${escapeHtml(record.excerpt)}</p>
          <div class="record-pills">${record.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        </button>`;
      }

      function relationships(record) {
        return edges
          .filter(
            (edge) =>
              edge.projectId === record.projectId &&
              (edge.src === record.id || edge.dst === record.id),
          )
          .map((edge) => {
            const outgoing = edge.src === record.id;
            const id = outgoing ? edge.dst : edge.src;
            const other = recordMap.get(`${edge.projectId}:${id}`);
            if (!other) return "";
            const direction = outgoing ? "to" : "from";
            return `<button type="button" class="relation-link" data-record="${escapeHtml(other.projectId)}:${escapeHtml(other.id)}"><span>${escapeHtml(edge.kind.replaceAll("_", " "))} ${direction}</span><strong>${escapeHtml(other.id)}</strong></button>`;
          })
          .filter(Boolean)
          .join("");
      }

      function detailMarkup(record, extraClass = "") {
        const related = relationships(record);
        return `<article class="detail-view ${extraClass}">
          <header class="detail-heading">
            <div class="record-meta"><span class="record-id">${escapeHtml(record.id)}</span>${statusPill(record.status)}<span class="type-pill">${escapeHtml(record.type.toUpperCase())}</span></div>
            <h1>${escapeHtml(record.title)}</h1>
            <div class="project-name">${escapeHtml(projectName(record.projectId))} · ${escapeHtml(record.date)}</div>
            <div class="record-pills">${record.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
          </header>
          <section class="detail-section"><h2>Decision record</h2><div class="detail-content">${escapeHtml(record.body)}</div></section>
          <section class="detail-section"><h2>Source</h2><div class="record-id">${escapeHtml(record.path)}</div></section>
          <section class="detail-section"><h2>Relationships</h2><div class="relationship-list">${related || '<span class="hint">No linked records in this sample.</span>'}</div></section>
        </article>`;
      }

      function resultSummary(items) {
        return `<span class="results-summary" aria-live="polite">${items.length} sample record${items.length === 1 ? "" : "s"} · ${state.query ? "ranked by relevance" : "title order"}</span>`;
      }

      function searchForm(placeholder = "Search titles and decision text") {
        return `<form class="search-form" data-search-form>
          <label class="filter-field" style="position:absolute;left:-10000px" for="record-query">Search records</label>
          <input id="record-query" name="q" type="search" value="${escapeHtml(state.query)}" placeholder="${escapeHtml(placeholder)}" />
          <button type="submit">Search</button>
        </form>`;
      }

      function pageHeader() {
        return `<header class="topbar">
          <div class="brand"><span class="brand-mark">D</span><span>Decision Graph</span></div>
          <div class="top-meta"><span class="sample-pill">Sample data</span><span class="hint">Read-only browser concept</span></div>
        </header>`;
      }

      function renderWorkbench(items, selected) {
        return `<div class="page layout-a">
          ${pageHeader()}
          <main class="workbench">
            <aside class="workbench-sidebar" aria-label="Project and record filters">
              <div class="sidebar-group"><h2>Find a decision</h2>${searchForm("Search records…")}</div>
              <div class="sidebar-group"><h2>Scope</h2>${filtersMarkup()}</div>
              <p class="hint">No project selected searches every configured project. Choose one to narrow the collection.</p>
            </aside>
            <section class="workbench-results" aria-label="Decision records">
              <div class="workbench-results-header"><h1>Records</h1>${resultSummary(items)}</div>
              <div class="workbench-list">${items.length ? items.map(recordRow).join("") : '<div class="empty-state">No records match these filters.</div>'}</div>
            </section>
            <aside class="workbench-detail" aria-label="Selected decision record">${detailMarkup(selected)}</aside>
          </main>
        </div>`;
      }

      function renderLibrary(items, selected) {
        const detailMode = state.mobileDetail ? " is-detail" : "";
        const listMarkup = items.length
          ? items
              .map((record) => recordCard(record, "library-card"))
              .join("")
          : '<div class="empty-state">No records match these filters.</div>';
        return `<div class="page layout-b">
          ${pageHeader()}
          <main class="library-page">
            <div class="library-heading">
              <div><h1>Decision library</h1><p>Browse durable choices across your connected projects.</p></div>
              <span class="sample-pill">Local collection</span>
            </div>
            <section class="library-search" aria-label="Search and filter records">
              ${searchForm("Search titles, rationale, or record text…")}
              ${filtersMarkup({ compact: true })}
              ${resultSummary(items)}
            </section>
            <div class="library-content${detailMode}">
              <section class="library-results" aria-label="Search results">${listMarkup}</section>
              <section class="reading-pane" aria-label="Record detail">
                <button type="button" class="library-back" data-back-to-results>← Back to results</button>
                ${detailMarkup(selected)}
              </section>
            </div>
          </main>
        </div>`;
      }

      function renderBoard(items, selected) {
        const lanes = [
          { title: "Accepted", statuses: ["accepted"] },
          { title: "In progress", statuses: ["proposed", "open"] },
          { title: "Promoted", statuses: ["promoted"] },
          { title: "Past decisions", statuses: ["superseded", "deprecated", "discarded"] },
        ];
        const laneMarkup = lanes
          .map((lane) => {
            const laneRecords = items.filter((record) =>
              lane.statuses.includes(record.status),
            );
            return `<section class="status-lane" aria-label="${escapeHtml(lane.title)} records">
              <header class="lane-header"><h2 class="lane-title">${escapeHtml(lane.title)}</h2><span class="lane-count">${laneRecords.length}</span></header>
              ${laneRecords.length ? laneRecords.map((record) => recordCard(record, "board-card")).join("") : '<p class="hint">No records</p>'}
            </section>`;
          })
          .join("");
        return `<div class="page layout-c">
          ${pageHeader()}
          <main class="board-page">
            <div class="board-heading"><div><h1>Decision status board</h1><p class="hint">A status-first way to scan decisions across projects.</p></div>${resultSummary(items)}</div>
            <section class="board-controls" aria-label="Search and filter records">
              ${searchForm("Find a title or decision…")}
              ${filtersMarkup({ compact: true })}
            </section>
            <div class="status-board">${laneMarkup}</div>
          </main>
          <aside class="board-detail-drawer${state.mobileDetail ? " is-open" : ""}" aria-label="Selected decision record">
            <button type="button" class="drawer-close" data-close-detail>Close detail</button>
            ${detailMarkup(selected)}
          </aside>
        </div>`;
      }

      function renderApp() {
        const variant = currentVariant();
        const items = visibleRecords();
        if (!items.some((record) => `${record.projectId}:${record.id}` === state.selected)) {
          state.selected = items[0]
            ? `${items[0].projectId}:${items[0].id}`
            : `${records[0].projectId}:${records[0].id}`;
        }
        const selected = selectedRecord();
        const view =
          variant === "B"
            ? renderLibrary(items, selected)
            : variant === "C"
              ? renderBoard(items, selected)
              : renderWorkbench(items, selected);
        app.innerHTML = view;
        const info = variations.find((item) => item.id === variant);
        variantLabel.innerHTML = `${info.id} <span>· ${info.name}</span>`;
        document.body.className = `variant-${variant}`;
      }

      function updateVariant(step) {
        const current = variations.findIndex(
          (item) => item.id === currentVariant(),
        );
        const next =
          (current + step + variations.length) % variations.length;
        const url = new URL(window.location.href);
        url.searchParams.set("variant", variations[next].id);
        window.history.pushState({}, "", url);
        state.mobileDetail = false;
        renderApp();
      }

      document.addEventListener("click", (event) => {
        const stepButton = event.target.closest("[data-variant-step]");
        if (stepButton) {
          updateVariant(Number(stepButton.dataset.variantStep));
          return;
        }
        const backButton = event.target.closest("[data-back-to-results]");
        if (backButton) {
          state.mobileDetail = false;
          renderApp();
          return;
        }
        const closeButton = event.target.closest("[data-close-detail]");
        if (closeButton) {
          state.mobileDetail = false;
          renderApp();
          return;
        }
        const recordButton = event.target.closest("[data-record]");
        if (recordButton) {
          state.selected = recordButton.dataset.record;
          if (currentVariant() === "B" || currentVariant() === "C") {
            state.mobileDetail = true;
          }
          renderApp();
        }
      });

      document.addEventListener("change", (event) => {
        const filter = event.target.closest("[data-filter]");
        if (!filter) return;
        if (filter.dataset.filter === "tags") {
          state.tags = [...filter.selectedOptions].map((option) => option.value);
        } else {
          state[filter.dataset.filter] = filter.value;
        }
        renderApp();
      });

      document.addEventListener("submit", (event) => {
        if (!event.target.matches("[data-search-form]")) return;
        event.preventDefault();
        state.query = new FormData(event.target).get("q").toString();
        state.mobileDetail = false;
        renderApp();
      });

      document.addEventListener("keydown", (event) => {
        const focused = event.target.closest(
          "input, textarea, select, [contenteditable='true']",
        );
        if (focused) return;
        if (event.key === "ArrowLeft") updateVariant(-1);
        if (event.key === "ArrowRight") updateVariant(1);
      });

      window.addEventListener("popstate", () => {
        state.mobileDetail = false;
        renderApp();
      });

      if (!new URLSearchParams(window.location.search).has("variant")) {
        const url = new URL(window.location.href);
        url.searchParams.set("variant", "A");
        window.history.replaceState({}, "", url);
      }

      renderApp();
    </script>
  </body>
</html>
